<div class="relative">
  <input
    #box
    type="text"
    role="combobox"
    autocomplete="off"
    aria-autocomplete="none"
    class="block min-h-11 w-full rounded-md border border-border bg-transparent py-2 pr-8 pl-3 text-foreground shadow-sm focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-accent aria-invalid:border-danger"
    [id]="inputId()"
    [placeholder]="placeholder()"
    [value]="text()"
    [attr.inputmode]="inputMode()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="listId()"
    [attr.aria-activedescendant]="open() ? optionId(activeValue()) : null"
    [attr.aria-invalid]="invalid()"
    [attr.aria-describedby]="describedBy()"
    [attr.data-testid]="testId()"
    [attr.data-value]="value()"
    (click)="onClick()"
    (input)="onInput(box.value)"
    (keydown)="onKeydown($event)"
    (blur)="onBoxBlur()"
  />
  <button
    type="button"
    tabindex="-1"
    aria-hidden="true"
    class="absolute inset-y-0 right-0 flex w-8 cursor-pointer items-center justify-center text-muted hover:text-foreground"
    (click)="toggle()"
  >
    <!-- Lucide "chevron-down" icon. -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="size-4"
    >
      <path d="m6 9 6 6 6-6" />
    </svg>
  </button>
</div>

<ul
  role="listbox"
  class="absolute top-full left-0 z-20 mt-2 max-h-60 w-full min-w-max overflow-y-auto rounded-xl border border-border bg-surface p-1 text-foreground shadow-lg"
  [id]="listId()"
  [hidden]="!open()"
  [attr.aria-label]="ariaLabel()"
>
  @if (open()) {
    @for (option of options(); track option.value) {
      <li
        role="option"
        class="cursor-pointer rounded-lg px-3 py-2 text-sm hover:bg-accent/10"
        [class.bg-accent]="option.value === value()"
        [class.font-semibold]="option.value === value()"
        [class.text-accent-foreground]="option.value === value()"
        [class.ring-1]="option.value === activeValue()"
        [class.ring-accent]="option.value === activeValue()"
        [id]="optionId(option.value)"
        [attr.aria-selected]="option.value === value()"
        (pointerdown)="$event.preventDefault()"
        (pointerup)="pick(option.value)"
      >
        {{ option.label }}
      </li>
    }
  }
</ul>
