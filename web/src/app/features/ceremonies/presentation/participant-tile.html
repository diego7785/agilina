<div
  class="flex items-center gap-3 rounded-xl border border-border p-3"
  *transloco="let t; prefix: 'ceremonies.room.participants'"
>
  <span
    class="flex size-8 shrink-0 items-center justify-center rounded-full bg-accent/10 text-xs font-semibold text-accent"
    aria-hidden="true"
    [class.opacity-60]="!row().connected"
  >
    {{ initials() }}
  </span>
  <div class="min-w-0 flex-1">
    <p
      class="flex flex-wrap gap-x-1 text-sm font-semibold break-words"
      [class.text-muted]="!row().connected"
    >
      <span data-testid="participant-name">{{ name() }}</span>
      @if (row().self) {
        <span data-testid="participant-self">{{ t('self') }}</span>
      }
    </p>
    @if (row().email; as email) {
      <p class="text-xs break-all text-muted" data-testid="participant-email">{{ email }}</p>
    }
  </div>
  <span
    class="inline-flex shrink-0 items-center gap-1 rounded-full px-2.5 py-0.5 text-xs font-semibold"
    [class]="row().connected ? 'bg-success/10 text-success' : 'bg-border/50 text-muted'"
    data-testid="participant-presence"
  >
    @if (!row().connected) {
      <!-- Lucide "mic-off" icon. -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="size-3.5"
        aria-hidden="true"
      >
        <line x1="2" x2="22" y1="2" y2="22" />
        <path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2" />
        <path d="M5 10v2a7 7 0 0 0 12 5" />
        <path d="M15 9.34V5a3 3 0 0 0-5.68-1.33" />
        <path d="M9 9v3a3 3 0 0 0 5.12 2.12" />
        <line x1="12" x2="12" y1="19" y2="22" />
      </svg>
    }
    {{ t(row().connected ? 'connected' : 'disconnected') }}
  </span>
</div>
