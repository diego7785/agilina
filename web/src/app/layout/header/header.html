<header
  class="sticky top-0 z-30 flex flex-wrap items-center justify-between gap-x-4 gap-y-2 border-b border-border bg-background/85 px-6 py-3 backdrop-blur"
  *transloco="let t; prefix: 'app'"
>
  <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
    <span class="flex items-center gap-2">
      <span
        class="flex size-9 items-center justify-center rounded-xl bg-accent text-accent-foreground"
        aria-hidden="true"
      >
        <!-- Lucide "bot" icon. -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-5"
        >
          <path d="M12 8V4H8" />
          <rect width="16" height="12" x="4" y="8" rx="2" />
          <path d="M2 14h2" />
          <path d="M20 14h2" />
          <path d="M15 13v2" />
          <path d="M9 13v2" />
        </svg>
      </span>
      <span class="font-display text-lg font-bold tracking-tight">{{ brand }}</span>
    </span>
    @if (team(); as team) {
      <span class="text-muted" aria-hidden="true">/</span>
      <!-- Lucide "users" icon. -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="size-4 text-muted"
        aria-hidden="true"
      >
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
        <path d="M16 3.128a4 4 0 0 1 0 7.744" />
        <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
        <circle cx="9" cy="7" r="4" />
      </svg>
      <span class="text-sm font-medium break-words" data-testid="header-team">{{ team.name }}</span>
      <span
        class="inline-flex items-center rounded-md bg-accent/10 px-2.5 py-0.5 text-xs font-semibold text-accent"
        data-testid="header-role-label"
      >
        {{ t('role_labels.' + team.roleLabel) }}
      </span>
    } @else {
      <span class="text-sm text-muted">{{ t('tagline') }}</span>
    }
  </div>
  @if (team(); as team) {
    <div class="flex flex-wrap items-center gap-x-4 gap-y-2">
      <a
        class="inline-flex min-h-11 items-center rounded-md px-3 text-xs font-medium hover:bg-accent/10 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
        data-testid="change-team"
        [routerLink]="tenant.path('teams')"
        [state]="chooseTeam"
      >
        {{ t('change_team') }}
      </a>
      <div class="flex items-center gap-2" data-testid="header-user">
        <span
          class="flex size-8 items-center justify-center rounded-full bg-accent/10 text-xs font-semibold text-accent"
          aria-hidden="true"
          data-testid="header-user-initials"
        >
          {{ initials() }}
        </span>
        <span class="text-sm font-medium break-words" data-testid="header-user-name">{{
          team.userName
        }}</span>
      </div>
    </div>
    <nav class="-mb-3 flex w-full gap-1 overflow-x-auto" [attr.aria-label]="t('nav.label')">
      <a
        class="flex min-h-11 items-center gap-2 border-b-2 border-transparent px-3 text-sm font-medium text-muted hover:text-foreground focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
        routerLinkActive="border-accent text-foreground"
        ariaCurrentWhenActive="page"
        data-testid="nav-dashboard"
        [routerLink]="tenant.path('teams', team.id)"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <!-- Lucide "layout-dashboard" icon. -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-4"
          aria-hidden="true"
        >
          <rect width="7" height="9" x="3" y="3" rx="1" />
          <rect width="7" height="5" x="14" y="3" rx="1" />
          <rect width="7" height="9" x="14" y="12" rx="1" />
          <rect width="7" height="5" x="3" y="16" rx="1" />
        </svg>
        {{ t('nav.dashboard') }}
      </a>
      @if (team.canConfigure) {
        <a
          class="flex min-h-11 items-center gap-2 border-b-2 border-transparent px-3 text-sm font-medium text-muted hover:text-foreground focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
          routerLinkActive="border-accent text-foreground"
          ariaCurrentWhenActive="page"
          data-testid="nav-settings"
          [routerLink]="tenant.path('teams', team.id, 'settings')"
        >
          <!-- Lucide "settings" icon. -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-4"
            aria-hidden="true"
          >
            <path
              d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"
            />
            <circle cx="12" cy="12" r="3" />
          </svg>
          {{ t('nav.settings') }}
        </a>
      }
    </nav>
  }
</header>
