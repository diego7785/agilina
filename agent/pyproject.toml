[project]
name = "agilina-agent"
version = "0.1.0"
description = "LiveKit Agents worker: everything that happens during the ceremony"
requires-python = ">=3.12"
dependencies = [
    "agilina-shared",
    "livekit-agents>=1.0",
    "livekit-plugins-elevenlabs==1.8.4",  # plugins pin livekit-agents to their own version
    "httpx>=0.27",
    "pydantic-settings>=2.4",
]

[tool.uv.sources]
agilina-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agilina_agent"]
